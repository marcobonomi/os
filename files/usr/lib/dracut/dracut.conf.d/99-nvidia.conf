# Replaces the file shipped by nvidia-kmod-common, which omits the driver.
# Early KMS: plymouth and the LUKS PIN prompt run on the NVIDIA GPU.
force_drivers+=" nvidia nvidia_modeset nvidia_drm "

# Plymouth pulls in every DRM driver with its firmware (~200 MB). Leave out the
# ones never used here: the alternative NVIDIA drivers (blacklisted anyway),
# AMD (iGPU disabled in the firmware setup) and Intel. simpledrm and the
# virtual GPUs (for VM tests) stay.
omit_drivers+=" nouveau nova_core nova_drm amdgpu radeon i915 xe "
